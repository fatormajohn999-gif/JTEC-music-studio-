name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        env:
          # Category 1: NASHEED — Nasheed & Spiritual Audio (supports secrets & vars)
          VITE_SUPABASE_NASHEED_URL: ${{ secrets.VITE_SUPABASE_NASHEED_URL || vars.VITE_SUPABASE_NASHEED_URL || secrets.SUPABASE_NASHEED_URL || vars.SUPABASE_NASHEED_URL || secrets.NASHEED_SUPABASE_URL || vars.NASHEED_SUPABASE_URL || secrets.NASHEED_URL || vars.NASHEED_URL || secrets.VITE_NASHEED_URL || vars.VITE_NASHEED_URL }}
          VITE_SUPABASE_NASHEED_ANON_KEY: ${{ secrets.VITE_SUPABASE_NASHEED_ANON_KEY || vars.VITE_SUPABASE_NASHEED_ANON_KEY || secrets.SUPABASE_NASHEED_ANON_KEY || vars.SUPABASE_NASHEED_ANON_KEY || secrets.NASHEED_SUPABASE_ANON_KEY || vars.NASHEED_SUPABASE_ANON_KEY || secrets.NASHEED_ANON_KEY || vars.NASHEED_ANON_KEY || secrets.NASHEED_KEY || vars.NASHEED_KEY || secrets.VITE_NASHEED_ANON_KEY || vars.VITE_NASHEED_ANON_KEY }}
          VITE_SUPABASE_NASHEED_BUCKET: ${{ secrets.VITE_SUPABASE_NASHEED_BUCKET || vars.VITE_SUPABASE_NASHEED_BUCKET || secrets.SUPABASE_NASHEED_BUCKET || vars.SUPABASE_NASHEED_BUCKET || secrets.NASHEED_BUCKET || vars.NASHEED_BUCKET || 'music' }}
          VITE_SUPABASE_NASHEED_TABLE: ${{ secrets.VITE_SUPABASE_NASHEED_TABLE || vars.VITE_SUPABASE_NASHEED_TABLE || secrets.SUPABASE_NASHEED_TABLE || vars.SUPABASE_NASHEED_TABLE || secrets.NASHEED_TABLE || vars.NASHEED_TABLE || 'songs' }}

          # Category 2: LOVE & CHILL — Love Songs, Melodic & Chill Beats (supports secrets & vars)
          VITE_SUPABASE_LOVE_CHILL_URL: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_URL || vars.VITE_SUPABASE_LOVE_CHILL_URL || secrets.SUPABASE_LOVE_CHILL_URL || vars.SUPABASE_LOVE_CHILL_URL || secrets.LOVE_CHILL_SUPABASE_URL || vars.LOVE_CHILL_SUPABASE_URL || secrets.LOVE_CHILL_URL || vars.LOVE_CHILL_URL || secrets.VITE_LOVE_CHILL_URL || vars.VITE_LOVE_CHILL_URL || secrets.VITE_LOVE_URL || vars.VITE_LOVE_URL }}
          VITE_SUPABASE_LOVE_CHILL_ANON_KEY: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_ANON_KEY || vars.VITE_SUPABASE_LOVE_CHILL_ANON_KEY || secrets.SUPABASE_LOVE_CHILL_ANON_KEY || vars.SUPABASE_LOVE_CHILL_ANON_KEY || secrets.LOVE_CHILL_SUPABASE_ANON_KEY || vars.LOVE_CHILL_SUPABASE_ANON_KEY || secrets.LOVE_CHILL_ANON_KEY || vars.LOVE_CHILL_ANON_KEY || secrets.LOVE_CHILL_KEY || vars.LOVE_CHILL_KEY || secrets.VITE_LOVE_CHILL_ANON_KEY || vars.VITE_LOVE_CHILL_ANON_KEY }}
          VITE_SUPABASE_LOVE_CHILL_BUCKET: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_BUCKET || vars.VITE_SUPABASE_LOVE_CHILL_BUCKET || secrets.SUPABASE_LOVE_CHILL_BUCKET || vars.SUPABASE_LOVE_CHILL_BUCKET || secrets.LOVE_CHILL_BUCKET || vars.LOVE_CHILL_BUCKET || 'music' }}
          VITE_SUPABASE_LOVE_CHILL_TABLE: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_TABLE || vars.VITE_SUPABASE_LOVE_CHILL_TABLE || secrets.SUPABASE_LOVE_CHILL_TABLE || vars.SUPABASE_LOVE_CHILL_TABLE || secrets.LOVE_CHILL_TABLE || vars.LOVE_CHILL_TABLE || 'songs' }}

          # Category 3: JTEC MUSIC — Mainstream Music, Super Bass & Other Genres (supports secrets & vars)
          VITE_SUPABASE_JTEC_URL: ${{ secrets.VITE_SUPABASE_JTEC_MAIN_URL || vars.VITE_SUPABASE_JTEC_MAIN_URL || secrets.VITE_SUPABASE_JTEC_URL || vars.VITE_SUPABASE_JTEC_URL || secrets.SUPABASE_JTEC_MAIN_URL || vars.SUPABASE_JTEC_MAIN_URL || secrets.SUPABASE_JTEC_URL || vars.SUPABASE_JTEC_URL || secrets.JTEC_URL || vars.JTEC_URL || secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_JTEC_MAIN_URL: ${{ secrets.VITE_SUPABASE_JTEC_MAIN_URL || vars.VITE_SUPABASE_JTEC_MAIN_URL || secrets.VITE_SUPABASE_JTEC_URL || vars.VITE_SUPABASE_JTEC_URL || secrets.SUPABASE_JTEC_MAIN_URL || vars.SUPABASE_JTEC_MAIN_URL || secrets.SUPABASE_JTEC_URL || vars.SUPABASE_JTEC_URL || secrets.JTEC_URL || vars.JTEC_URL || secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_JTEC_ANON_KEY: ${{ secrets.VITE_SUPABASE_JTEC_MAIN_ANON_KEY || vars.VITE_SUPABASE_JTEC_MAIN_ANON_KEY || secrets.VITE_SUPABASE_JTEC_ANON_KEY || vars.VITE_SUPABASE_JTEC_ANON_KEY || secrets.SUPABASE_JTEC_MAIN_ANON_KEY || vars.SUPABASE_JTEC_MAIN_ANON_KEY || secrets.SUPABASE_JTEC_ANON_KEY || vars.SUPABASE_JTEC_ANON_KEY || secrets.JTEC_KEY || vars.JTEC_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_JTEC_MAIN_ANON_KEY: ${{ secrets.VITE_SUPABASE_JTEC_MAIN_ANON_KEY || vars.VITE_SUPABASE_JTEC_MAIN_ANON_KEY || secrets.VITE_SUPABASE_JTEC_ANON_KEY || vars.VITE_SUPABASE_JTEC_ANON_KEY || secrets.SUPABASE_JTEC_MAIN_ANON_KEY || vars.SUPABASE_JTEC_MAIN_ANON_KEY || secrets.SUPABASE_JTEC_ANON_KEY || vars.SUPABASE_JTEC_ANON_KEY || secrets.JTEC_KEY || vars.JTEC_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_JTEC_BUCKET: ${{ secrets.VITE_SUPABASE_JTEC_BUCKET || vars.VITE_SUPABASE_JTEC_BUCKET || secrets.SUPABASE_JTEC_BUCKET || vars.SUPABASE_JTEC_BUCKET || secrets.VITE_SUPABASE_BUCKET || vars.VITE_SUPABASE_BUCKET || secrets.SUPABASE_BUCKET || vars.SUPABASE_BUCKET || 'music' }}
          VITE_SUPABASE_JTEC_TABLE: ${{ secrets.VITE_SUPABASE_JTEC_TABLE || vars.VITE_SUPABASE_JTEC_TABLE || secrets.SUPABASE_JTEC_TABLE || vars.SUPABASE_JTEC_TABLE || secrets.VITE_SUPABASE_TABLE || vars.VITE_SUPABASE_TABLE || secrets.SUPABASE_TABLE || vars.SUPABASE_TABLE || 'songs' }}

          # Fallbacks / legacy variables
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}

          # Category 4: JAMENDO — Jamendo Catalog Client ID
          VITE_JAMENDO_CLIENT_ID: ${{ secrets.VITE_JAMENDO_CLIENT_ID || vars.VITE_JAMENDO_CLIENT_ID }}
        run: npm run build

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('resources/icon.png').convert('RGB')
          res = 'android/app/src/main/res'
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, fg) in sizes.items():
              folder = res + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              icon = src.resize((legacy, legacy), Image.LANCZOS)
              icon.save(folder + '/ic_launcher.png')
              mask = Image.new('L', (legacy, legacy), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, legacy - 1, legacy - 1), fill=255)
              round_icon = icon.convert('RGBA')
              round_icon.putalpha(mask)
              round_icon.save(folder + '/ic_launcher_round.png')
              canvas = Image.new('RGBA', (fg, fg), (0, 0, 0, 0))
              inner = int(fg * 0.72)
              logo = src.resize((inner, inner), Image.LANCZOS).convert('RGBA')
              off = (fg - inner) // 2
              canvas.paste(logo, (off, off))
              canvas.save(folder + '/ic_launcher_foreground.png')
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          PY

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Verify Android manifest permissions and media service
        run: node scripts/ensure-android-manifest.cjs

      - name: Configure Android package ID and version settings
        env:
          PACKAGE_ID: ${{ secrets.CAPACITOR_APP_ID || vars.CAPACITOR_APP_ID || secrets.ANDROID_PACKAGE_ID || vars.ANDROID_PACKAGE_ID || 'com.jtecmusic.app' }}
          VERSION_NAME: ${{ vars.APP_VERSION_NAME || secrets.APP_VERSION_NAME || '1.0' }}.${{ github.run_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const gradlePath = path.resolve('android/app/build.gradle');
          if (fs.existsSync(gradlePath)) {
            let content = fs.readFileSync(gradlePath, 'utf8');
            const pkgId = process.env.PACKAGE_ID || 'com.jtecmusic.app';
            const verName = process.env.VERSION_NAME || '1.0.1';
            // versionCode grows with every build so each new APK can update the old one
            let verCode = 100 + parseInt(process.env.RUN_NUMBER || '1', 10);
            if (isNaN(verCode) || verCode < 101) verCode = 101;
            
            content = content.replace(/applicationId\s+["'][^"']+["']/, `applicationId "${pkgId}"`);
            content = content.replace(/versionCode\s+\d+/, `versionCode ${verCode}`);
            content = content.replace(/versionName\s+["'][^"']+["']/, `versionName "${verName}"`);
            
            fs.writeFileSync(gradlePath, content, 'utf8');
            console.log(`[configure-android] Configured build.gradle with applicationId=${pkgId}, versionCode=${verCode}, versionName=${verName}`);
          }
          NODE

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign and align release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.SIGNING_KEY || secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: signing key secret (KEYSTORE_BASE64) is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          RELEASE_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"
          ALIGNED_APK="$RELEASE_DIR/app-release-aligned.apk"
          SIGNED_APK="$RELEASE_DIR/jtec-music-release.apk"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android build tools from: $BUILD_TOOLS_DIR"
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: unsigned APK not found at $UNSIGNED_APK"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi
          "$BUILD_TOOLS_DIR/zipalign" -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          rm -f /tmp/release.keystore "$UNSIGNED_APK" "$ALIGNED_APK"
          echo "Signed APK ready: $SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jtec-music-apk
          path: android/app/build/outputs/apk/release/jtec-music-release.apk
