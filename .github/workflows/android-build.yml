name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        env:
          # Category 1: NASHEED — Nasheed & Spiritual Audio (supports secrets & vars)
          VITE_SUPABASE_NASHEED_URL: ${{ secrets.VITE_SUPABASE_NASHEED_URL || vars.VITE_SUPABASE_NASHEED_URL || secrets.SUPABASE_NASHEED_URL || vars.SUPABASE_NASHEED_URL || secrets.NASHEED_SUPABASE_URL || vars.NASHEED_SUPABASE_URL }}
          VITE_SUPABASE_NASHEED_ANON_KEY: ${{ secrets.VITE_SUPABASE_NASHEED_ANON_KEY || vars.VITE_SUPABASE_NASHEED_ANON_KEY || secrets.SUPABASE_NASHEED_ANON_KEY || vars.SUPABASE_NASHEED_ANON_KEY || secrets.NASHEED_SUPABASE_ANON_KEY || vars.NASHEED_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_NASHEED_BUCKET: ${{ secrets.VITE_SUPABASE_NASHEED_BUCKET || vars.VITE_SUPABASE_NASHEED_BUCKET || secrets.SUPABASE_NASHEED_BUCKET || vars.SUPABASE_NASHEED_BUCKET || 'music' }}
          VITE_SUPABASE_NASHEED_TABLE: ${{ secrets.VITE_SUPABASE_NASHEED_TABLE || vars.VITE_SUPABASE_NASHEED_TABLE || secrets.SUPABASE_NASHEED_TABLE || vars.SUPABASE_NASHEED_TABLE || 'songs' }}

          # Category 2: LOVE & CHILL — Love Songs, Melodic & Chill Beats (supports secrets & vars)
          VITE_SUPABASE_LOVE_CHILL_URL: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_URL || vars.VITE_SUPABASE_LOVE_CHILL_URL || secrets.SUPABASE_LOVE_CHILL_URL || vars.SUPABASE_LOVE_CHILL_URL || secrets.LOVE_CHILL_SUPABASE_URL || vars.LOVE_CHILL_SUPABASE_URL }}
          VITE_SUPABASE_LOVE_CHILL_ANON_KEY: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_ANON_KEY || vars.VITE_SUPABASE_LOVE_CHILL_ANON_KEY || secrets.SUPABASE_LOVE_CHILL_ANON_KEY || vars.SUPABASE_LOVE_CHILL_ANON_KEY || secrets.LOVE_CHILL_SUPABASE_ANON_KEY || vars.LOVE_CHILL_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_LOVE_CHILL_BUCKET: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_BUCKET || vars.VITE_SUPABASE_LOVE_CHILL_BUCKET || secrets.SUPABASE_LOVE_CHILL_BUCKET || vars.SUPABASE_LOVE_CHILL_BUCKET || 'music' }}
          VITE_SUPABASE_LOVE_CHILL_TABLE: ${{ secrets.VITE_SUPABASE_LOVE_CHILL_TABLE || vars.VITE_SUPABASE_LOVE_CHILL_TABLE || secrets.SUPABASE_LOVE_CHILL_TABLE || vars.SUPABASE_LOVE_CHILL_TABLE || 'songs' }}

          # Category 3: JTEC MUSIC — Mainstream Music, Super Bass & Other Genres (supports secrets & vars)
          VITE_SUPABASE_JTEC_URL: ${{ secrets.VITE_SUPABASE_JTEC_URL || vars.VITE_SUPABASE_JTEC_URL || secrets.SUPABASE_JTEC_URL || vars.SUPABASE_JTEC_URL || secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_JTEC_ANON_KEY: ${{ secrets.VITE_SUPABASE_JTEC_ANON_KEY || vars.VITE_SUPABASE_JTEC_ANON_KEY || secrets.SUPABASE_JTEC_ANON_KEY || vars.SUPABASE_JTEC_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_JTEC_BUCKET: ${{ secrets.VITE_SUPABASE_JTEC_BUCKET || vars.VITE_SUPABASE_JTEC_BUCKET || secrets.SUPABASE_JTEC_BUCKET || vars.SUPABASE_JTEC_BUCKET || 'music' }}
          VITE_SUPABASE_JTEC_TABLE: ${{ secrets.VITE_SUPABASE_JTEC_TABLE || vars.VITE_SUPABASE_JTEC_TABLE || secrets.SUPABASE_JTEC_TABLE || vars.SUPABASE_JTEC_TABLE || 'songs' }}

          # Fallbacks / legacy variables
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('resources/icon.png').convert('RGB')
          res = 'android/app/src/main/res'
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, fg) in sizes.items():
              folder = res + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              icon = src.resize((legacy, legacy), Image.LANCZOS)
              icon.save(os.path.join(folder, 'ic_launcher.png'), 'PNG')
              icon_round = src.resize((legacy, legacy), Image.LANCZOS)
              mask = Image.new('L', (legacy, legacy), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, legacy, legacy), fill=255)
              icon_round.putalpha(mask)
              icon_round.save(os.path.join(folder, 'ic_launcher_round.png'), 'PNG')
              fg_img = src.resize((fg, fg), Image.LANCZOS)
              fg_img.save(os.path.join(folder, 'ic_launcher_foreground.png'), 'PNG')
          PY

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Verify Android manifest permissions and media service
        run: node scripts/ensure-android-manifest.cjs

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jtec-music-apk
          path: android/app/build/outputs/apk/release/*.apk
