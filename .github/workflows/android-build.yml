name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('resources/icon.png').convert('RGB')
          res = 'android/app/src/main/res'
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, fg) in sizes.items():
              folder = res + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              icon = src.resize((legacy, legacy), Image.LANCZOS)
              icon.save(folder + '/ic_launcher.png')
              mask = Image.new('L', (legacy, legacy), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, legacy - 1, legacy - 1), fill=255)
              round_icon = icon.convert('RGBA')
              round_icon.putalpha(mask)
              round_icon.save(folder + '/ic_launcher_round.png')
              canvas = Image.new('RGBA', (fg, fg), (0, 0, 0, 0))
              inner = int(fg * 0.72)
              logo = src.resize((inner, inner), Image.LANCZOS).convert('RGBA')
              off = (fg - inner) // 2
              canvas.paste(logo, (off, off))
              canvas.save(folder + '/ic_launcher_foreground.png')
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          PY

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks keystore.p12 --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out JTEC-native.apk aligned.apk
          "$BT/apksigner" verify JTEC-native.apk
          rm keystore.p12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JTEC-native-apk
          path: JTEC-native.apk
