name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks keystore.p12 --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out JTEC-native.apk aligned.apk
          "$BT/apksigner" verify JTEC-native.apk
          rm keystore.p12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JTEC-native-apk
          path: JTEC-native.apk
