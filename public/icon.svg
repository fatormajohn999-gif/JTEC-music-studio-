<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="8 8"/>

  <!-- JTEC Musical Cyber Symbol -->
  <g filter="url(#glow)">
    <!-- Vinyl Ring Pattern -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="12"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="4"/>
    <circle cx="256" cy="256" r="80" fill="none" stroke="url(#neonGlow)" stroke-width="8"/>
    
    <!-- Stylized 'J' and Note / Equalizer Bars -->
    <rect x="180" y="210" width="14" height="92" rx="7" fill="#00f0ff"/>
    <rect x="206" y="170" width="14" height="132" rx="7" fill="#38bdf8"/>
    <rect x="232" y="140" width="14" height="162" rx="7" fill="#818cf8"/>
    <rect x="258" y="160" width="14" height="142" rx="7" fill="#a855f7"/>
    <rect x="284" y="190" width="14" height="112" rx="7" fill="#c084fc"/>
    <rect x="310" y="225" width="14" height="77" rx="7" fill="#ec4899"/>
    
    <!-- Cyber Headphone Arc -->
    <path d="M 140 270 A 120 120 0 0 1 372 270" fill="none" stroke="url(#neonGlow)" stroke-width="12" stroke-linecap="round"/>
    <rect x="125" y="260" width="28" height="52" rx="14" fill="#00f0ff"/>
    <rect x="359" y="260" width="28" height="52" rx="14" fill="#ec4899"/>
  </g>

  <!-- Soundwave Pulse Accent -->
  <circle cx="256" cy="256" r="44" fill="#070913" stroke="url(#neonGlow)" stroke-width="4"/>
  <circle cx="256" cy="256" r="16" fill="#00f0ff"/>
</svg>
